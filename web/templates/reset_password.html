
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reset Password | AI Virtual Mouse</title>
</head>
<body>
    <h1>Reset Password</h1>

    {% if error %}<p role="alert">{{ error }}</p>{% endif %}
    {% if success %}
        <p role="status">{{ success }}</p>
        <p><a href="{{ url_for('login') }}">Go to Login</a></p>
    {% elif token %}
        <form method="POST"
              action="{{ url_for('reset_password', token=token) }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

            <label for="new_password">New password</label>
            <input id="new_password" type="password"
                   name="new_password" minlength="8" required>

            <label for="confirm_password">Confirm password</label>
            <input id="confirm_password" type="password"
                   name="confirm_password" minlength="8" required>

            <button type="submit">Reset Password</button>
        </form>
    {% endif %}

    <p><a href="{{ url_for('login') }}">Back to Login</a></p>
</body>
</html>
